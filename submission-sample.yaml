# Coldline - Task 1.6
# File: submission-sample.yaml
# Edit only answer values in submission.yaml; keep the supplied keys and types.
# Empty strings, nulls, and placeholder text are incomplete and fail verification.
# Use submission-sample.yaml for YAML formatting only; do not copy its fictional values.
# Do not include secrets, personal data, or local absolute paths.
# Use docs/student/evidence-pack.json for assessed answers; retain your required local
# investigations for the final defense.
# FICTIONAL FORMAT EXAMPLE: values do not answer the supplied Task. Comments identify the real
# questions so you can compare this shape with the blank sheet.

answers:

  # Task 1.6 — Step 2: Assembling decision evidence and structured answers
  # Assess each D01-D04 decision claim and select its required number of evidence records. The
  # quoted claims are statements to assess, not confirmed findings.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # assessment options (use exact values):
  # - supported: The supplied evidence establishes the claim within its stated bounds.
  # - contradicted: The supplied evidence establishes the opposite of the claim.
  # - insufficient-evidence: The supplied evidence does not establish the claim or its opposite.
  #
  # evidence_ids options (use exact values):
  # - E61: API and worker source observations.
  # - E62: Captured baseline and injected load results.
  # - E63: Planning model and its inputs.
  # - E64: Two-worker pilot operating policy.
  # - E65: Provider and deployment fidelity boundaries.
  # - E66: Queue, duration, and percentile measurement definitions.
  decision_evidence_mappings:
    # D01: The observed downstream worker stage warrants a bounded scaling investigation.
    # Source: docs/student/evidence-pack.json, decision_claims.D01.
    D01:
      # Support for this claim: choose one string from assessment options above.
      assessment: "insufficient-evidence"
      # Evidence: list of exactly 2 IDs from evidence_ids options above; no duplicates.
      evidence_ids: ["E66", "E61"]
    # D02: The planning worker count is a modeled estimate, not observed production capacity.
    # Source: docs/student/evidence-pack.json, decision_claims.D02.
    D02:
      # Support for this claim: choose one string from assessment options above.
      assessment: "insufficient-evidence"
      # Evidence: list of exactly 2 IDs from evidence_ids options above; no duplicates.
      evidence_ids: ["E66", "E61"]
    # D03: Use a two-worker local pilot with rollback and measurement gates.
    # Source: docs/student/evidence-pack.json, decision_claims.D03.
    D03:
      # Support for this claim: choose one string from assessment options above.
      assessment: "insufficient-evidence"
      # Evidence: list of exactly 1 ID from evidence_ids options above; no duplicates.
      evidence_ids: ["E66"]
    # D04: Claim the local test proves production model quality and high availability.
    # Source: docs/student/evidence-pack.json, decision_claims.D04.
    D04:
      # Support for this claim: choose one string from assessment options above.
      assessment: "insufficient-evidence"
      # Evidence: list of exactly 1 ID from evidence_ids options above; no duplicates.
      evidence_ids: ["E66"]

  # Task 1.6 — Step 1: Public verification before the held-out gate
  # Evaluate each R01-R04 reviewer statement. Select a verdict, its reason, and one evidence record.
  # These cases do not report the outcome of your own CI or defense.
  # Source: docs/student/evidence-pack.json; guidance: docs/student/evidence-guide.md.
  #
  # verdict options (use exact values):
  # - valid: The reviewer's reasoning is justified by the supplied evidence.
  # - invalid: The reviewer's reasoning misuses a measurement or makes an invalid deduction.
  # - needs-more-evidence: The supplied evidence is not sufficient to decide whether the reasoning
  #   holds.
  #
  # reason options (use exact values):
  # - retained-entries-are-not-outstanding: Retained stream entries and unfinished jobs represent
  #   different counts.
  # - marginal-percentiles-are-not-additive: Separate component percentiles do not add up to an
  #   end-to-end percentile.
  # - acceptance-is-not-completion: Accepting work and finishing its background processing are
  #   different events.
  # - assumptions-and-measurements-separated: Planning assumptions are explicitly distinguished from
  #   observed measurements.
  # - local-results-prove-production: The claim that local results establish production behavior.
  #
  # evidence_ids options (use exact values):
  # - E61: API and worker source observations.
  # - E62: Captured baseline and injected load results.
  # - E63: Planning model and its inputs.
  # - E64: Two-worker pilot operating policy.
  # - E65: Provider and deployment fidelity boundaries.
  # - E66: Queue, duration, and percentile measurement definitions.
  review_cases:
    # R01: A reviewer substitutes Redis XLEN for unfinished-job backlog.
    # Source: docs/student/evidence-pack.json, review_cases.R01.
    R01:
      # Verdict on this review: choose one string from verdict options above.
      verdict: "needs-more-evidence"
      # Reason for your verdict: choose one string from reason options above.
      reason: "local-results-prove-production"
      # Evidence: list of exactly 1 ID from evidence_ids options above; no duplicates.
      evidence_ids: ["E66"]
    # R02: A reviewer adds API p95 and worker p95 to claim end-to-end p95.
    # Source: docs/student/evidence-pack.json, review_cases.R02.
    R02:
      # Verdict on this review: choose one string from verdict options above.
      verdict: "needs-more-evidence"
      # Reason for your verdict: choose one string from reason options above.
      reason: "local-results-prove-production"
      # Evidence: list of exactly 1 ID from evidence_ids options above; no duplicates.
      evidence_ids: ["E66"]
    # R03: A reviewer cites a source-defined 202 response as proof the asynchronous job completed.
    # Source: docs/student/evidence-pack.json, review_cases.R03.
    R03:
      # Verdict on this review: choose one string from verdict options above.
      verdict: "needs-more-evidence"
      # Reason for your verdict: choose one string from reason options above.
      reason: "local-results-prove-production"
      # Evidence: list of exactly 1 ID from evidence_ids options above; no duplicates.
      evidence_ids: ["E66"]
    # R04: A reviewer separates hypothetical 10x traffic inputs from measured local service time.
    # Source: docs/student/evidence-pack.json, review_cases.R04.
    R04:
      # Verdict on this review: choose one string from verdict options above.
      verdict: "needs-more-evidence"
      # Reason for your verdict: choose one string from reason options above.
      reason: "local-results-prove-production"
      # Evidence: list of exactly 1 ID from evidence_ids options above; no duplicates.
      evidence_ids: ["E66"]

