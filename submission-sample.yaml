  #   capacity.
  # - managed-service-behavior-unproven: The supplied evidence does not establish managed cloud
  #   service behavior.
  # - model-quality-unproven: The supplied evidence does not establish production model output
  #   quality.
  # - all-production-behavior-proven: The supplied evidence establishes all production behavior.
  #
  # evidence_ids options (use exact values):
  # - E61: API and worker source observations.
  # - E62: Captured baseline and injected load results.
  # - E63: Planning model and its inputs.
  # - E64: Two-worker pilot operating policy.
  # - E65: Provider and deployment fidelity boundaries.
  # - E66: Queue, duration, and percentile measurement definitions.
  limitations_statement:
    # Select the limitations established for the supplied case.
    # YAML list: choose 3 unique values from the classifications options above; order does not
    # matter.
    classifications: ["managed-service-behavior-unproven", "model-quality-unproven", "all-production-behavior-proven"]
    # Select the evidence records supporting this answer.
    # YAML list: choose 1 unique value from the evidence_ids options above; order does not matter.
    evidence_ids: ["E66"]

  # Task 1.6 — Step 2: Assembling decision evidence and structured answers
