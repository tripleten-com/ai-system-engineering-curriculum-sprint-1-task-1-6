# Coldline - Task 1.6
# File: .github/workflows/protected-review.yml
# Component: Protected held-out review CI
# Purpose: Grade the held-out scenario without exposing its expected values to students.
# Interacts With: uv, Poe, Docker Compose, tests/contract/held_out_review.py
# Sprint/Task: Sprint 1 - Project 1 / Task 1.6
# Concepts: Held-out evaluation
# Tools: GitHub Actions

name: Task 1.6 protected review

# pull_request_target (not pull_request): the workflow definition and the grading script below must
# come from the base branch, not the student's PR branch, since a student PR could otherwise edit
# tests/contract/held_out_review.py to leak the secret it runs with.
#
# workflow_dispatch is deliberately absent. A manual dispatch runs the DISPATCHED branch's own copy of
# this file, so a student with push access could delete the path gate below and trigger a secret-scoped
# run from the Actions tab. There is no legitimate manual-run use case for this grading job.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  held-out-review:
    # Belt and braces for the `on:` block above. Only a genuine pull_request_target event supplies the
    # github.event.pull_request context that the checkout ref and the path gate below depend on; under
    # any other event those expressions silently evaluate to empty and both protections degrade to
    # no-ops. The same-repo check keeps a fork's PR from triggering a secret-scoped run at all.
    #
    # The final clause skips generated export PRs, which regenerate the whole template and so can
    # never satisfy the two-path boundary below — before it, every export PR tripped this gate and
    # reported a permanent, meaningless failure.
    #
    # Note carefully that `github.head_ref` is ATTACKER-CONTROLLED: a student chooses their own
    # branch name, and a bare `startsWith(github.head_ref, 'export/')` skip would let them dodge
    # held-out grading just by naming a branch `export/anything`. That is why the skip additionally
    # requires an OWNER/MEMBER author association, which a student submitting from outside the org
    # cannot set. Residual risk: an org member could still self-skip, so this narrows the gate
    # rather than closing it completely. Skipping produces no grade, not a passing grade, and a
    # missing held-out result is visible to the instructor.
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !(
        startsWith(github.head_ref, 'export/')
        && contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Check out the student's submitted code — that is what the held-out scenario grades.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history, not the default shallow clone. The path gate below resolves a merge base,
          # which means walking the parent chain on BOTH sides until they meet; a depth-limited clone
          # truncates those chains and merge-base then finds nothing. No fixed depth is safe either,
          # since it only moves the branch-age at which a legitimate PR starts failing. This workflow
          # runs once per pull request event on a single-task repository, so the full clone is cheap.
          fetch-depth: 0
      - name: Restore the trusted grading script (defense against a student editing it in their PR)
        # No --depth on this fetch: a shallow fetch into a complete repository makes it shallow again
        # and would re-break the merge base resolved in the next step.
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}
          git checkout ${{ github.event.pull_request.base.sha }} -- tests/contract/held_out_review.py
      # Fail closed before ANY student-authored code runs in this job. Restoring the grading script
      # alone is not enough: the steps below execute the PR's own bootstrap.py, compose files, and
      # Poe tasks, any of which could plant code (for example a sitecustomize.py in the virtual
      # environment) that later runs inside the one step that holds HELD_OUT_SCENARIO. This job may
      # therefore only proceed for a submission that stays inside Task 1.6's two-path boundary.
      - name: Enforce the submission path boundary before running student code
        run: |
          set -euo pipefail
          # Diff against the merge base, not the base branch tip. base.sha is where the base branch
          # happened to point when the event fired, so any commit it gained that the student's branch
          # does not have would show up here as a "changed" file and hard-fail an untouched-boundary
          # submission. Fail closed if the merge base cannot be resolved rather than grading blind.
          merge_base="$(git merge-base ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})"
          if [ -z "$merge_base" ]; then
            echo "Could not resolve a merge base for this pull request — refusing to grade."
            exit 1
          fi
          changed="$(git diff --name-only "$merge_base" ${{ github.event.pull_request.head.sha }})"
          protected="$(printf '%s\n' "$changed" \
            | grep -v -x -e '' -e 'submission.yaml' -e 'docs/student/decision-evidence-record.md' || true)"
          if [ -n "$protected" ]; then
            echo "This pull request changes paths outside Task 1.6's student-editable boundary:"
            # Read line by line rather than letting the shell word-split $protected: a path containing
            # a glob character would otherwise be expanded against the working tree.
            while IFS= read -r offending_path; do
              printf '  %s\n' "$offending_path"
            done <<<"$protected"
            echo "Only submission.yaml and docs/student/decision-evidence-record.md may change."
            echo "The held-out review cannot grade a submission that modifies the supplied system."
            exit 1
          fi
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          python infra/scripts/bootstrap.py
          python infra/scripts/preflight.py
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          .tools/bin/uv sync --frozen
      - name: Start the stack
        run: .tools/bin/uv run --frozen poe start
      - name: Wait for readiness
        run: .tools/bin/uv run --frozen poe ready
      - name: Run the held-out check
        env:
          HELD_OUT_SCENARIO: ${{ secrets.HELD_OUT_SCENARIO }}
        run: |
          if [ -z "$HELD_OUT_SCENARIO" ]; then
            echo "HELD_OUT_SCENARIO secret is not set for this repository — cannot grade."
            exit 1
          fi
          # The scenario reaches the script through the environment only. Passing it as an argument
          # would publish it in /proc/<pid>/cmdline to every other process on the runner.
          .tools/bin/uv run --frozen python tests/contract/held_out_review.py "http://localhost:${COLDLINE_API_HOST_PORT:-8000}"
      - name: Tear down
        if: always()
        run: .tools/bin/uv run --frozen poe reset
